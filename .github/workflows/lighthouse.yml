name: Lighthouse CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/web

      - name: Build
        run: npm run build --prefix apps/web
        env:
          NEXT_PUBLIC_APP_URL: https://www.nexyyra.com
          NEXT_PUBLIC_API_URL: https://www.nexyyra.com/api
          MEDIA_PROVIDER: google-drive
          GOOGLE_DRIVE_FOLDER_ID: 1UZR_UhiZfVvcLUNvDJi3Rvw8udkfKgYM

      # Start the production server explicitly — Lighthouse previously failed with
      # chrome-error://chromewebdata/ because no server was listening on :3000.
      - name: Start production server
        run: |
          nohup npm run start --prefix apps/web > server.log 2>&1 &
          echo $! > server.pid

      - name: Wait for server
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused --fail --silent --output /dev/null http://localhost:3000/
          echo "Server is responding with HTTP 200"

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/web/lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Stop server
        if: always()
        run: |
          kill "$(cat server.pid)" 2>/dev/null || true
          tail -20 server.log || true
